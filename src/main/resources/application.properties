spring.application.name=service-management
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.datasource.url=jdbc:h2:mem:service-management;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.port=8080

logging.level.root=INFO
logging.level.com.example.servicemanagement=INFO

integration.notification.base-url=http://localhost:9090
